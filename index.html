<style>
/* Layout: one phone column, glass cards over a coloured backdrop, floating glass tab bar. Four colour themes. */
:root{
  color-scheme: dark;
  --bg:#071A24; --bg-2:#0B2430;
  --fg:#EAF6F4; --muted:#A9C9C6; --faint:#6F908D;

  --warn:#FFD166; --warn-soft:rgba(255,209,102,.16); --over:#FF8FA3; --over-soft:rgba(255,143,163,.16);
  --sheet:#2A1730; --sheet-bg:rgba(42,23,48,.9); --toast:rgba(42,23,48,.94); --nav:rgba(40,20,48,.6); --scrim:rgba(10,4,12,.55);
  --scan-line:rgba(255,158,122,.5); --b1:#B8476A; --b2:#6B2E8F; --b3:#E0784A;
}
:root[data-skin="gold"]{
  --bg:#0E0E16; --bg-2:#1A1A26; --fg:#F4F1E8; --muted:#BDB7CC; --faint:#807A92;
  --accent:#F5C451; --accent-ink:#2A2005; --accent-soft:rgba(245,196,81,.16);
  --sheet:#1A1826; --sheet-bg:rgba(26,24,38,.9); --toast:rgba(26,24,38,.94); --nav:rgba(22,20,34,.6); --scrim:rgba(4,4,8,.55);
  --scan-line:rgba(245,196,81,.5); --b1:#3B2F6B; --b2:#8A6A1F; --b3:#1F3B5B;
}
:root[data-skin="sage"]{
  color-scheme: light;
  --bg:#EEF0E6; --bg-2:#F7F8F2; --fg:#1C2620; --muted:#4A5A50; --faint:#6B7A70;
  --accent:#2F5D46; --accent-ink:#FFFFFF; --accent-soft:rgba(47,93,70,.12);
  --warn:#B45309; --warn-soft:rgba(180,83,9,.12); --over:#BE123C; --over-soft:rgba(190,18,60,.1);
  --glass:rgba(255,255,255,.45); --glass-2:rgba(255,255,255,.75); --line:rgba(255,255,255,.75); --hi:rgba(255,255,255,.95);
  --sheet:#F2F4EC; --sheet-bg:rgba(247,248,242,.93); --toast:rgba(255,255,255,.94); --nav:rgba(255,255,255,.62); --scrim:rgba(28,38,32,.28);
  --divider:rgba(28,38,32,.08); --track:rgba(28,38,32,.1); --field:rgba(255,255,255,.65); --field-line:rgba(28,38,32,.14);
  --grab:rgba(28,38,32,.2); --scan-line:rgba(47,93,70,.4); --shadow:rgba(60,80,60,.12);

}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.link{background:none;border:0;color:var(--accent);font-weight:700;font-size:14px;padding:8px 0;min-height:36px}
.btn{min-height:48px;padding:0 18px;border-radius:24px;border:1px solid var(--line);background:var(--glass-2);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}

.btn.block{width:100%}
.btn:disabled{opacity:.5}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar>i.warn{background:var(--warn)} .bar>i.over{background:var(--over)}
.list{display:flex;flex-direction:column}
.tx{display:flex;align-items:center;gap:12px;padding:10px 4px;background:none;border:0;border-bottom:1px solid var(--divider);text-align:left;width:100%;min-width:0}

.toast{display:flex;align-items:center;gap:12px}

.tx .t{flex:1;min-width:0}
.tx .t div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap}
.amt.in{color:var(--accent)}

.empty{padding:22px 8px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

.input{display:block;width:100%;min-width:0;max-width:100%;height:48px;margin:0;padding:0 14px;-webkit-appearance:none;appearance:none;line-height:normal;border-radius:var(--r-sm);border:1px solid var(--field-line);background:var(--field);font-size:16px}

.amount-input{font-size:34px;font-weight:800;height:64px;text-align:center}

<body>

  <button type="button" data-act="tab" data-tab="activity" aria-label="Transactions"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Activity</button>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const EXP_DEFAULT = ['Food','Gifts','Health/Medical','Home','Transportation','Personal','Pets','Utilities','Travel','Debt','Insurance','Subscriptions','Investments','Other'];

const txOf = key => months[key] || [];

  return { inc: round2(inc), exp: round2(exp), net: round2(inc - exp) };
}

}
function endBalance(key) { const s = startBalance(key); return s == null ? null : round2(s + totals(key).net); }
function catActual(key, type, name) { let s = 0; for (const t of txOf(key)) if (t.type === type && t.cat === name) s += +t.amount || 0; return round2(s); }
/* periods: a calendar month, or a Monday to Sunday week. Weekly plans are 12/52 of the monthly plan. */
const WEEK_FACTOR = 12 / 52;
function addDaysIso(iso, n) { const [y, m, d] = iso.split('-').map(Number); return isoDate(new Date(y, m - 1, d + n)); }

function totalsP(p) { let inc = 0, exp = 0; for (const t of txRange(p)) { if (t.type === 'income') inc += +t.amount || 0; else exp += +t.amount || 0; } return { inc: round2(inc), exp: round2(exp), net: round2(inc - exp) }; }

}
function periodStartBalance(p) { const s = `${config.startMonth}-01`; if (p.to < s) return null; return p.from <= s ? round2(+config.startingBalance || 0) : balanceAt(addDaysIso(p.from, -1)); }

/* ---------- auto categories ---------- */
function suggestCat(desc, type) {

  const names = (type === 'income' ? config.income : config.expense).map(c => c.name);
  if (rules[prefix + key] && names.includes(rules[prefix + key])) return rules[prefix + key];
  for (const r in rules) { if (r.startsWith(prefix) && r.length > 4 && key.includes(r.slice(2)) && names.includes(rules[r])) return rules[r]; }

// Older items stored a day of the month and a first month; read them as monthly from that date.
const recStart = r => r.startDate || `${r.start || mk(today())}-${pad(Math.min(+r.day || 1, daysIn(r.start || mk(today()))))}`;

/* ---------- insights: pay, safe to spend, debts, trends, weekly limits ---------- */
const allTx = () => Object.values(months).flat();
const dayDiff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const shortDay = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const PERIOD_DAYS = { once: Infinity, weekly: 7, fortnightly: 14, '4weekly': 28, monthly: 365 / 12, quarterly: 365 / 4, yearly: 365 };
const perMonth = (amt, f) => (+amt || 0) * (365 / 12) / (PERIOD_DAYS[f] || PERIOD_DAYS.monthly);

/* pay: base amount and payday, worked out from paychecks unless set by hand */
function payInfo() {
  const p = config.pay || {}, now = isoDate(today());
  const pays = allTx().filter(t => t.type === 'income' && t.cat === 'Paycheck').sort((a, b) => a.date.localeCompare(b.date));
  const recent = pays.filter(t => t.date >= addDaysIso(now, -120));
  const cnt = {}; for (const t of recent) { const k = (+t.amount).toFixed(2); cnt[k] = (cnt[k] || 0) + 1; }
  const mode = +((Object.entries(cnt).sort((a, b) => b[1] - a[1])[0] || [0])[0]);
  const base = +p.base || mode || 0;
  const near = pays.filter(t => base && Math.abs(t.amount - base) <= base * 0.5 || (base && t.amount > base));
  const wd = {}; for (const t of recent.filter(t => base && t.amount >= base * 0.8)) { const d = new Date(t.date + 'T00:00:00').getDay(); wd[d] = (wd[d] || 0) + 1; }
  const weekday = p.weekday != null && p.weekday !== '' ? +p.weekday : +((Object.entries(wd).sort((a, b) => b[1] - a[1])[0] || [4])[0]);
  const freq = p.freq || 'weekly';
  const last = near.length ? near[near.length - 1].date : '';
  return { base, weekday, freq, last, auto: !p.base, pays };
}
function nextPayday(pi) {
  const now = isoDate(today()), step = pi.freq === 'fortnightly' ? 14 : 7;
  const paidToday = allTx().some(t => t.date === now && t.type === 'income' && t.cat === 'Paycheck');
  if (pi.freq === 'fortnightly' && pi.last) {
    let d = pi.last; while (d < now || (d === now && paidToday)) d = addDaysIso(d, 14); return d;
  }
  for (let i = 0; i <= step; i++) { const d = addDaysIso(now, i); if (new Date(d + 'T00:00:00').getDay() === pi.weekday && !(i === 0 && paidToday)) return d; }
  return addDaysIso(now, step);
}
/* recurring bills not yet added, after one date and up to another */
function billsBetween(fromExcl, toIncl, type = 'expense') {
  const out = [];
  for (const r of config.recurring) {
    if ((r.type || 'expense') !== type) continue;
    for (let n = 0; n < 3000; n++) { const d = occurrence(r, n); if (d > toIncl) break; if (d > fromExcl && !recSkipped(r, d) && !recAdded(r, d)) out.push({ r, date: d }); }
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
/* cash you can count on: bank balances from screenshots when they're recent, otherwise the app's own balance */
const isCardAcct = x => x.kind ? x.kind === 'card' : (/card|neo|credit|ifnf|mastercard|visa|latitude/i.test(x.name || '') || (+x.balance || 0) < 0);
function cashNow() {
  const now = isoDate(today()), list = Object.values(config.accounts || {}).filter(x => !isCardAcct(x) && x.count !== false);
  const fresh = list.filter(x => x.at && Date.now() - x.at < 36 * 3600000);
  if (fresh.length && fresh.length === list.length) {
    const v = round2(list.reduce((a, x) => a + (x.available != null ? +x.available : +x.balance || 0), 0));
    return { v, src: 'bank', at: Math.min(...list.map(x => x.at)) };
  }
  const b = balanceAt(now); return b == null ? null : { v: b, src: 'app' };
}
/* walk forward day by day: bills out, base pay in, and find the lowest point */
function forecast() {
  const now = isoDate(today()), cash = cashNow(); if (!cash) return null;
  const pi = payInfo(), p1 = nextPayday(pi), p2 = addDaysIso(p1, pi.freq === 'fortnightly' ? 14 : 7);
  const end = [p2, addDaysIso(now, 14)].sort().pop();
  const ev = billsBetween(now, end).map(b => ({ date: b.date, name: b.r.name, v: -(+b.r.amount || 0) }));
  if (cash.src === 'bank') for (const t of txOf(now.slice(0, 7))) if (t.date === now && t.src === 'recurring' && t.type === 'expense') ev.push({ date: now, name: t.desc, v: -(+t.amount || 0) });
  if (pi.base) for (let d = p1; d <= end; d = addDaysIso(d, pi.freq === 'fortnightly' ? 14 : 7)) ev.push({ date: d, name: 'Base pay', v: pi.base, pay: true });
  ev.sort((a, b) => a.date.localeCompare(b.date) || (a.pay ? 1 : 0) - (b.pay ? 1 : 0));
  let bal = cash.v, low = cash.v, lowDate = now, lowName = '', neg = null;
  for (const e of ev) { bal = round2(bal + e.v); e.bal = bal; if (bal < low) { low = bal; lowDate = e.date; lowName = e.name; } if (bal < 0 && !neg) neg = e; }
  const billsTotal = round2(-ev.filter(e => !e.pay).reduce((a, e) => a + e.v, 0));
  return { cash, pi, p1, end, ev, low: round2(low), lowDate, lowName, neg, billsTotal, endBal: bal };
}

async function prepColor(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => createImageBitmap(file));
  const scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);

async function scanReceipt(file) {

async function saveTx() {
  const ctx = sheetCtx, err = $('formErr');

/* swipe left on a transaction to delete it */
const SW = { row: null, open: null, x0: 0, y0: 0, base: 0, dx: 0, mode: '' };
const DEL_W = 88;
function swipeSet(row, x, anim) {
  const tx = row.querySelector('.tx'), del = row.querySelector('.swipe-del');
  tx.style.transition = del.style.transition = anim ? 'transform .22s ease, width .22s ease' : 'none';
  tx.style.transform = x ? `translateX(${x}px)` : '';
  del.style.width = `${Math.max(0, -x)}px`;
  del.tabIndex = x ? 0 : -1;
}
function swipeClose(row) { if (row) swipeSet(row, 0, true); if (SW.open === row) SW.open = null; }
document.addEventListener('pointerdown', e => {
  const row = e.target.closest('.swipe');
  if (SW.open && SW.open !== row) swipeClose(SW.open);
  if (!row || e.target.closest('.swipe-del')) return;
  SW.row = row; SW.x0 = e.clientX; SW.y0 = e.clientY; SW.base = SW.open === row ? -DEL_W : 0; SW.dx = SW.base; SW.mode = '';
});
document.addEventListener('pointermove', e => {
  const row = SW.row; if (!row) return;
  const dx = e.clientX - SW.x0, dy = e.clientY - SW.y0;
  if (!SW.mode) { if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) SW.mode = 'h'; else if (Math.abs(dy) > 8) { SW.mode = 'v'; SW.row = null; return; } else return; }
  SW.dx = Math.min(0, Math.max(-row.offsetWidth, SW.base + dx));
  swipeSet(row, SW.dx, false);
});
function swipeEnd() {
  const row = SW.row; SW.row = null; if (!row || SW.mode !== 'h') return;
  row.dataset.swiped = '1'; setTimeout(() => { delete row.dataset.swiped; }, 350);
  if (SW.dx < -row.offsetWidth * 0.55) { swipeSet(row, -row.offsetWidth, true); const t = txOf(row.dataset.m).find(x => x.id === row.dataset.id); if (t) setTimeout(() => removeTx(t), 180); return; }
  if (SW.dx < -DEL_W / 2) { swipeSet(row, -DEL_W, true); SW.open = row; } else swipeClose(row);
}
document.addEventListener('pointerup', swipeEnd);
document.addEventListener('pointercancel', swipeEnd);

function freqOf(v) {
  const t = String(v || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  if (/^(once|oneoff|single)/.test(t)) return 'once'; if (/^week/.test(t)) return 'weekly'; if (/fortnight|2week|biweek/.test(t)) return 'fortnightly'; if (/4week|every4/.test(t)) return '4weekly';
  if (/quarter|3month/.test(t)) return 'quarterly'; if (/year|annual/.test(t)) return 'yearly'; return 'monthly';
}

    config.imports = config.imports.filter(b => !ids.has(b.id));
    sheetCtx.items = importRows(sheetCtx);
  }
  const fresh = sheetCtx.items.filter(t => !t.dup);
  let added = 0;
  const dates = fresh.map(t => t.date).sort();
  const batch = { id: 'imp-' + uid(), name: importName || 'Imported file', at: new Date().toISOString(), count: fresh.length, from: dates[0] || '', to: dates[dates.length - 1] || '' };
  if (fresh.length) config.imports.push(batch);
  for (const t of fresh) {
    if (t.newCat) { const list = t.type === 'income' ? config.income : config.expense; if (!matchCat(t.cat, t.type)) { list.push({ name: t.cat, planned: 0 }); added++; } }
    if (t.fromFile) learn(t.desc, t.type, t.cat);
    const { dup, fromFile, newCat, takes, ...tx } = t; tx.batch = batch.id;
    if (takes) { for (const mk2 of Object.keys(months)) { const n = months[mk2].length; months[mk2] = months[mk2].filter(x => x.id !== takes); if (months[mk2].length !== n) touched.add(mk2); } tx.id = takes; }
    const k = tx.date.slice(0, 7); (months[k] = months[k] || []).push(tx); touched.add(k);
  }
  closeSheet(); render(); await saveMonths([...touched]); await saveConfig();
  toast(`Imported ${fresh.length} transactions${added ? ` and ${added} new categor${added === 1 ? 'y' : 'ies'}` : ''}`);
}

/* import history: every import is kept as a group so it can be deleted in one go */
const LEGACY = 'legacy';
function importGroups() {
  const all = Object.values(months).flat(), counts = {};
  for (const t of all) if (t.src === 'import') { const b = t.batch || LEGACY; counts[b] = (counts[b] || 0) + 1; }
  const list = config.imports.map(b => ({ ...b, n: counts[b.id] || 0 })).filter(b => b.n > 0).reverse();
  if (counts[LEGACY]) {
    const d = all.filter(t => t.src === 'import' && !t.batch).map(t => t.date).sort();
    list.push({ id: LEGACY, name: 'Earlier imports', note: 'Imported before the app kept a history', n: counts[LEGACY], from: d[0], to: d[d.length - 1] });
  }
  return list;
}
const shortDate = iso => iso ? new Date(iso.slice(0, 10) + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
function openImports() {
  const g = importGroups();
  openSheet(`${sheetHead('Import history')}
  <div class="note">Each file you import is kept here as a group. Delete a group to remove every transaction it added. Transactions you entered yourself stay.</div>
  ${g.length ? `<div class="list">${g.map(b => `<div class="glass card" style="border-radius:var(--r-md);gap:8px">
    <div><div style="font-weight:700;word-break:break-all">${esc(b.name)}</div>
    <div class="small muted"><span class="num">${b.n}</span> transaction${b.n === 1 ? '' : 's'} · ${esc(shortDate(b.from))} to ${esc(shortDate(b.to))}</div>
    <div class="tiny muted">${b.at ? 'Imported ' + esc(shortDate(b.at)) : esc(b.note || '')}</div></div>
    <button type="button" class="btn danger block" data-act="impdel" data-id="${esc(b.id)}">Delete this import</button></div>`).join('')}</div>`
    : `<div class="glass empty"><div style="font-weight:700;color:var(--fg)">No imports yet</div><div class="small">Files you import from More show here.</div></div>`}`, { kind: 'imports' });
}
async function deleteImport(btn) {
  if (btn.dataset.confirm !== '1') { btn.dataset.confirm = '1'; btn.textContent = 'Tap again to delete'; return; }
  const id = btn.dataset.id, removed = {}, touched = [];
  for (const k of Object.keys(months)) {
    const out = months[k].filter(t => t.src === 'import' && (id === LEGACY ? !t.batch : t.batch === id));
    if (!out.length) continue;
    removed[k] = out; months[k] = months[k].filter(t => !out.includes(t)); touched.push(k);
  }
  const bi = config.imports.findIndex(b => b.id === id), batch = bi >= 0 ? config.imports.splice(bi, 1)[0] : null;
  const n = Object.values(removed).reduce((a, l) => a + l.length, 0);
  openImports(); render(); await saveMonths(touched); await saveConfig();
  toast(`Deleted ${n} imported transaction${n === 1 ? '' : 's'}`, { label: 'Undo', run: async () => {
    for (const [k, l] of Object.entries(removed)) (months[k] = months[k] || []).push(...l);
    if (batch) config.imports.push(batch);
    if (sheetCtx && sheetCtx.kind === 'imports') openImports();
    render(); await saveMonths(touched); await saveConfig(); toast('Restored');
  } });
}

/* backup */
function openBackup(pending) {
  openSheet(`${sheetHead('Backup and restore')}
  <div class="note">Save a backup file to Files or iCloud Drive now and then. You can restore it here at any time.</div>
  <button type="button" class="btn primary block" data-act="exportjson">${I.save} Save backup file</button>
  <button type="button" class="btn block" data-act="exportcsv">Export transactions as CSV</button>
  <label class="scan" for="restorefile">${I.upload}<span>Restore from a backup file</span><input id="restorefile" type="file" accept=".json,application/json"></label>
  ${pending ? `<div class="glass card" style="border-radius:var(--r-md)"><div class="small">This backup has <strong class="num">${pending.count}</strong> transactions from ${esc(pending.when)}. Restoring replaces everything in the app now.</div><button type="button" class="btn danger block" data-act="restorego">Replace my data with this backup</button></div>` : ''}`,
  { kind: 'backup', pending });
}
async function saveFile(filename, data, type) {
  const file = new File([data], filename, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
function exportJSON() { saveFile(`lagoon-finance-backup-${isoDate(today())}.json`, JSON.stringify({ app: 'lagoon-finance', v: 1, exportedAt: new Date().toISOString(), config, months }, null, 1), 'application/json'); }
function exportCSV() {
  const all = Object.values(months).flat().sort((a, b) => a.date.localeCompare(b.date));
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const csv = ['Date,Type,Category,Description,Amount', ...all.map(t => [t.date, t.type, q(t.cat), q(t.desc), (t.type === 'income' ? '' : '-') + (+t.amount).toFixed(2)].join(','))].join('\n');
  saveFile(`lagoon-finance-transactions-${isoDate(today())}.csv`, csv, 'text/csv');
}
async function readBackup(file) {
  try {
    const p = JSON.parse(await file.text());
    if (p.app !== 'lagoon-finance' || !p.config || typeof p.months !== 'object') throw 0;
    const count = Object.values(p.months).reduce((a, m) => a + (Array.isArray(m) ? m.length : 0), 0);
    sheetCtx.data = p; openBackup({ count, when: p.exportedAt ? new Date(p.exportedAt).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : 'an earlier date' }); sheetCtx.data = p;
  } catch { toast('That is not a Lagoon Finance backup file.'); }
}
async function runRestore() {
  const p = sheetCtx.data; if (!p) return;
  const old = Object.keys(months);
  config = mergeConfig(p.config); months = {};
  for (const [k, v] of Object.entries(p.months)) if (/^\d{4}-\d{2}$/.test(k) && Array.isArray(v)) months[k] = v;
  closeSheet(); render();
  await saveConfig(); await saveMonths([...new Set([...old, ...Object.keys(months)])]);
  toast('Backup restored');
}

/* toast */
let toastTimer;
let toastAction = null;
function toast(msg, action) {
  const t = $('toast'); toastAction = action || null;
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button" class="toastbtn" data-act="toastaction">${esc(action.label)}</button>` : ''}`;
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; toastAction = null; }, action ? 5000 : 2600);
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  switch (a) {
    case 'tab': closeSheet(); ui.tab = el.dataset.tab; storeSet('lf-tab', ui.tab); render(); window.scrollTo(0, 0); break;
    case 'month': if (ui.period === 'week') { ui.week = addDaysIso(ui.week, 7 * +el.dataset.d); ui.month = ui.week.slice(0, 7); } else ui.month = addMonths(ui.month, +el.dataset.d); render(); break;
    case 'period': {
      const v = el.dataset.v; if (v === ui.period) break;
      if (v === 'week') { const now = isoDate(today()); ui.week = weekStartOf(now.slice(0, 7) === ui.month ? now : `${ui.month}-01`); }
      else ui.month = addDaysIso(ui.week, 3).slice(0, 7);
      ui.period = v; storeSet('lf-period', v); render(); break; }
    case 'year': ui.year += +el.dataset.d; render(); break;
    case 'plantab': ui.tab = 'plan'; ui.planTab = el.dataset.p; render(); break;
    case 'filter': ui.filter = el.dataset.f; render(); break;
    case 'add': if (mode !== 'wait') openTxSheet(); break;
    case 'close': closeSheet(); break;
    case 'toastaction': { const a = toastAction; toastAction = null; $('toast').hidden = true; if (a) a.run(); break; }
    case 'swipedel': { const row = el.closest('.swipe'); const t = row && txOf(row.dataset.m).find(x => x.id === row.dataset.id); SW.open = null; if (t) removeTx(t); break; }
    case 'edit': { const sr = el.closest('.swipe'); if (sr && sr.dataset.swiped) break; if (sr && SW.open === sr) { swipeClose(sr); break; } const t = txOf(el.dataset.m).find(x => x.id === el.dataset.id); if (t) openTxSheet(t); break; }
    case 'settype': {
      sheetCtx.type = el.dataset.t;
      el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
      const sel = $('f-cat'); if (sel) { sel.innerHTML = catOptions(sheetCtx.type, ''); sheetCtx.catTouched = false; const d = $('f-desc'); if (d) autoCat(d.value); }
      break; }
    case 'savetx': saveTx(); break;
    case 'deltx': deleteTx(el); break;
    case 'recurring': openRecurring(); break;
    case 'recedit': openRecurring(el.dataset.id); break;
    case 'recsave': saveRecurring(); break;
    case 'recdel': deleteRecurring(el); break;
    case 'goaledit': openGoal(el.dataset.id); break;
    case 'goalsave': saveGoal(); break;
    case 'tmonth': ui.month = addMonths(ui.month, +el.dataset.d); render(); break;
    case 'paysettings': openPaySettings(); break;
    case 'paysave': { const v = parseMoney($('p-base').value); config.pay = { base: isFinite(v) && v > 0 ? round2(Math.abs(v)) : '', weekday: +$('p-day').value, freq: $('p-freq').value }; closeSheet(); render(); await saveConfig(); toast('Pay saved'); break; }
    case 'payauto': config.pay = {}; closeSheet(); render(); await saveConfig(); toast('Pay worked out from your paychecks'); break;
    case 'watchedit': openWatch(); break;
    case 'watchsave': config.watch = [...document.querySelectorAll('[data-watch]')].filter(x => x.checked).map(x => x.dataset.watch); closeSheet(); render(); await saveConfig(); toast('Weekly limits saved'); break;
    case 'debtedit': openDebt(el.dataset.id); break;
    case 'debtsave': saveDebt(); break;
    case 'extra': openExtra(el.dataset.id); break;
    case 'extrasave': saveExtra(); break;
    case 'debtdel': if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Tap again to delete'; break; } config.debts = config.debts.filter(d => d.id !== sheetCtx.id); closeSheet(); render(); await saveConfig(); toast('Debt deleted'); break;
    case 'debtsimportgo': { const ds = sheetCtx.debts || []; config.debts = config.debts || []; for (const d of ds) { const ex = config.debts.find(x => x.name.toLowerCase() === d.name.toLowerCase()); if (ex) Object.assign(ex, d, { setAt: Date.now() }); else config.debts.push({ id: uid(), ...d, setAt: Date.now() }); } closeSheet(); ui.tab = 'plan'; ui.planTab = 'debts'; render(); await saveConfig(); toast(`Added ${ds.length} debts`); break; }
    case 'shots': openShots(); break;
    case 'acctedit': openAcct(el.dataset.k); break;
    case 'acctsave': { const old = config.accounts[sheetCtx.k], last4 = $('a-last4').value.replace(/\D/g, '').slice(-4), k2 = last4 || sheetCtx.k; delete config.accounts[sheetCtx.k]; config.accounts[k2] = { ...old, name: $('a-name').value.trim() || old.name, nameSet: true, last4, kind: $('a-kind').value, count: $('a-count').checked }; closeSheet(); render(); await saveConfig(); toast('Account saved'); break; }
    case 'acctdel': if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Tap again to remove'; break; } delete config.accounts[sheetCtx.k]; closeSheet(); render(); await saveConfig(); toast('Account removed'); break;
    case 'shotgo': runShotImport(); break;
    case 'billsimportgo': { const bs = sheetCtx.bills || [], rm = (sheetCtx.removals || []).map(n => n.toLowerCase()); config.recurring = config.recurring.filter(r => !rm.includes(r.name.toLowerCase())); for (const b of bs) { const ex = config.recurring.find(r => r.name.toLowerCase() === b.name.toLowerCase()); if (ex) { Object.assign(ex, b); delete ex.day; delete ex.start; } else config.recurring.push({ id: uid(), ...b, skip: [] }); } closeSheet(); await saveConfig(); applyRecurring(); render(); toast(`Added ${bs.length} recurring bills`); break; }
    case 'budgetimportgo': { const it = sheetCtx.items || []; for (const x of it) { const list = x.type === 'income' ? config.income : config.expense, c = list.find(k => k.name === x.name); if (c) c.planned = x.planned; else list.push({ name: x.name, planned: x.planned }); } closeSheet(); ui.tab = 'plan'; ui.planTab = 'budget'; render(); await saveConfig(); toast(`Set ${it.length} budgets`); break; }
    case 'goalimportgo': { const gs = sheetCtx.goals || []; for (const g of gs) config.goals.push({ id: uid(), ...g }); closeSheet(); ui.tab = 'plan'; ui.planTab = 'goals'; render(); await saveConfig(); toast(`Added ${gs.length} goal${gs.length === 1 ? '' : 's'}`); break; }
    case 'goaldel': if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Tap again to delete'; break; } config.goals = config.goals.filter(g => g.id !== sheetCtx.id); closeSheet(); render(); await saveConfig(); toast('Goal deleted'); break;
    case 'goaladd': openGoalAdd(el.dataset.id); break;
    case 'goaladdsave': { const v = parseMoney($('ga-amount').value); if (!isFinite(v) || !v) { toast('Enter an amount.'); break; } const g = config.goals.find(x => x.id === sheetCtx.id); g.saved = round2(Math.max(0, g.saved + v)); closeSheet(); render(); await saveConfig(); toast(g.saved >= g.target ? 'Goal reached' : 'Added to goal'); break; }
    case 'settings': openSettings(); break;
    case 'settingssave': { const v = parseMoney($('s-bal').value); config.startingBalance = isFinite(v) ? round2(v) : 0; config.startMonth = $('s-month').value || mk(today()); closeSheet(); render(); await saveConfig(); toast('Saved'); break; }
    case 'categories': openCategories(); break;
    case 'catadd': { const type = el.dataset.type, inp = $('newcat-' + type), name = inp.value.trim(); if (!name) break; if (config[type].some(c => c.name.toLowerCase() === name.toLowerCase())) { toast('That category already exists.'); break; } config[type].push({ name, planned: 0 }); openCategories(); render(); await saveConfig(); break; }
    case 'catdel': { if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Tap again'; break; } config[el.dataset.type].splice(+el.dataset.i, 1); openCategories(); render(); await saveConfig(); break; }
    case 'ruledel': delete config.rules[el.dataset.k]; openCategories(); await saveConfig(); break;
    case 'import': openImport(); break;
    case 'importgo': runImport(); break;
    case 'importreplace': if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Tap again to replace'; break; } runImport(true); break;
    case 'imports': openImports(); break;
    case 'impdel': deleteImport(el); break;
    case 'backup': openBackup(); break;
    case 'skin': applySkin(el.dataset.v); if (config.skin !== el.dataset.v) { config.skin = el.dataset.v; saveConfig(); } render(); break;
    case 'icon': openIconSheet(el.dataset.v); break;
    case 'copyurl': { const u = sheetCtx && sheetCtx.url; try { await navigator.clipboard.writeText(u); toast('Link copied'); } catch { const r = document.createRange(); r.selectNodeContents($('iconurl')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Link selected. Tap Copy.'); } break; }
    case 'exportjson': exportJSON(); break;
    case 'exportcsv': exportCSV(); break;
    case 'restorego': runRestore(); break;
  }
});
function autoCat(desc) {
  if (!sheetCtx || sheetCtx.catTouched) return;
  const s = suggestCat(desc, sheetCtx.type), sel = $('f-cat'), hint = $('catHint');
  if (s && sel) { sel.innerHTML = catOptions(sheetCtx.type, s); if (hint) { hint.hidden = false; hint.textContent = `Category set to ${s} from the store name.`; } }
}
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'search') { ui.search = e.target.value; render(); }
  else if (id === 'f-desc' && sheetCtx && sheetCtx.kind === 'tx') autoCat(e.target.value);
  else if (id === 'f-amount' && sheetCtx && sheetCtx.items) renderSplit();
  else if (id === 'x-amount' && sheetCtx && sheetCtx.kind === 'extra') extraPreview();
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'f-cat' && sheetCtx) { sheetCtx.catTouched = !!el.value; const h = $('catHint'); if (h) h.hidden = true; if (sheetCtx.items) renderSplit(); }
  else if (el.id === 'split-on' && sheetCtx) sheetCtx.splitOn = el.checked;
  else if (el.dataset.item && sheetCtx && sheetCtx.items) { const i = sheetCtx.items[+el.dataset.item]; i.cat = el.value; i.touched = true; sheetCtx.itemsOpen = true; renderSplit(); }
  else if (el.id === 'f-receipt' && el.files && el.files[0]) { scanReceipt(el.files[0]); el.value = ''; }
  else if (el.id === 'r-start' || el.id === 'r-freq') recPreview();
  else if (el.id === 'csvfile' && el.files && el.files[0]) readCSV(el.files[0]);
  else if (el.id === 'shotfile' && el.files && el.files.length) { readShots([...el.files]); el.value = ''; }
  else if (el.id === 'restorefile' && el.files && el.files[0]) readBackup(el.files[0]);
  else if (el.id === 'mp-own' && sheetCtx && sheetCtx.kind === 'import') { sheetCtx.map.own = el.checked; openImport(sheetCtx); }
  else if (el.dataset.map && sheetCtx && sheetCtx.kind === 'import') { const k = el.dataset.map; sheetCtx.map[k] = (k === 'fmt' || k === 'sign') ? el.value : +el.value; openImport(sheetCtx); }
  else if (el.dataset.plan) { const v = parseMoney(el.value); config[el.dataset.plan][+el.dataset.i].planned = isFinite(v) ? Math.abs(round2(v / (+el.dataset.f || 1))) : 0; render(); await saveConfig(); }
});
document.addEventListener('toggle', e => { if (e.target.id === 'splitItems' && sheetCtx) sheetCtx.itemsOpen = e.target.open; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

$('addBtn').disabled = true;
initStore();
})();
