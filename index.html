  --warn:#FDBA74; --warn-soft:rgba(253,186,116,.16);
  --over:#FB8A9B; --over-soft:rgba(251,138,155,.16);
  --glass:rgba(255,255,255,.075); --glass-2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.17); --hi:rgba(255,255,255,.28);
  --sheet:#0D2731; --sheet-bg:rgba(13,39,49,.88); --toast:rgba(13,39,49,.92);
  --nav:rgba(10,36,46,.6); --scrim:rgba(2,10,14,.55); --divider:rgba(255,255,255,.07);
  --track:rgba(255,255,255,.12); --field:rgba(0,0,0,.22); --field-line:rgba(255,255,255,.17);
  --grab:rgba(255,255,255,.25); --scan-line:rgba(94,234,212,.5); --shadow:rgba(0,0,0,.22);
  --b1:#0F7C78; --b2:#1E4FA8; --b3:#0E6B5C; --picker:invert(.8);
  /* good news (income, money saved, bars on track) uses the accent unless a theme sets it apart */
  --good:var(--accent); --good-soft:var(--accent-soft);
  --font:'Manrope', -apple-system, 'SF Pro Text', system-ui, sans-serif;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi),0 18px 40px var(--shadow);border-radius:var(--r-lg)}

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const EXP_DEFAULT = ['Food','Gifts','Health/Medical','Home','Transportation','Personal','Pets','Utilities','Travel','Debt','Insurance','Subscriptions','Investments','Other'];

/* money from a loan or pay advance: it lands in your account but it isn't income, so it's kept out of income and savings */
const BORROW_CAT = 'Borrowed';
const LENDER_RE = /beforepay|wagetap|wage ?pay|wagego|\bewa payout|cash converters|jacaranda|credit corp|wallet ?wizard|wizit|power ?up|fundo|stay finance|myjuno|nimble|moneyme|cash train|\bdisb\b|disbursement|pay advance|loan (payout|advance)/i;

const KEYWORDS_EXP = [

  [/\bbp\b|shell|ampol|caltex|7-?eleven|7 eleven|united petrol|myki|\bptv\b|\buber\b(?!\s*\*?\s*eats)|didi|citylink|eastlink|linkt|parking|vicroads|tyre|mechanic/i,'Transportation'],
  [/netflix|spotify|disney|\bstan\b|binge|kayo|apple\.com|icloud|youtube|prime video|amazon prime|audible|chatgpt|claude\.ai|anthropic|adobe|microsoft 365|xbox|playstation/i,'Subscriptions'],
  [/origin|\bagl\b|energyaustralia|red energy|alinta|momentum energy|telstra|optus|vodafone|aussie broadband|\btpg\b|yarra valley water|south east water|greater western water|council/i,'Utilities'],
  [/chemist|priceline|pharmacy|medical|dental|dentist|physio|hospital|pathology|optometr|specsavers/i,'Health/Medical'],
  [/ikea|harvey norman|jb ?hi-?fi|officeworks|good guys|rent\b|real estate/i,'Home'],
  [/petbarn|pet ?stock|\bvet\b|veterinary/i,'Pets'],
  [/qantas|virgin australia|jetstar|airbnb|booking\.com|expedia|hotel|motel|webjet/i,'Travel'],
  [/aami|allianz|budget direct|racv|youi|nrma|\bnib\b|bupa|medibank|\bhcf\b|insurance/i,'Insurance'],
  [/afterpay|zip ?pay|\bloan\b|credit card|humm/i,'Debt'],
  [/vanguard|commsec|\bstake\b|selfwealth|raiz|spaceship|pearler|superhero/i,'Investments'],
  [/gift|florist|flowers/i,'Gifts'],
  [/bunnings|kmart|\btarget\b|big w|hair|barber|cotton on|uniqlo|myer|david jones|rebel|gym|fitness|cinema|hoyts|village/i,'Personal']
];
const KEYWORDS_INC = [
  [/salary|wage|payroll|\bpay\b|pay ?cheque|paycheck/i,'Paycheck'],
  [/interest/i,'Interest'],
  [/dividend|distribution/i,'Dividends'],
  [/transfer from|from savings/i,'Transfer From Savings'],
  [/refund|repay/i,'Repayment']
];
const AUD = new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'});
const AUD0 = new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0});
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MSHORT = ['J','F','M','A','M','J','J','A','S','O','N','D'];

/* ---------- small utils ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const today = () => new Date();
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mk = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const addMonths = (key, n) => { let [y,m] = key.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
const monthDiff = (a, b) => { const [ay,am] = a.split('-').map(Number), [by,bm] = b.split('-').map(Number); return (by-ay)*12 + (bm-am); };
const daysIn = key => { const [y,m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const monthName = key => { const [y,m] = key.split('-').map(Number); return { name: MONTHS[m-1], year: y }; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const money = n => AUD.format(n || 0);
const money0 = n => AUD0.format(n || 0);
const round2 = n => Math.round(n * 100) / 100;
const parseMoney = s => { if (s == null) return NaN; let t = String(s).trim(); if (!t) return NaN; let neg = /^\(.*\)$/.test(t) || /^-/.test(t) || /-$/.test(t) || /\bDR\b/i.test(t); t = t.replace(/[^0-9.]/g,''); if (!t) return NaN; const v = parseFloat(t); return neg ? -v : v; };
const normKey = s => String(s || '').toLowerCase().replace(/[^a-z&' ]+/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(w => w.length > 1).slice(0,3).join(' ');
function prettyDay(iso) {
  const d = new Date(iso + 'T00:00:00'); const t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((t - d) / 86400000);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
}
function storeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

/* ---------- state ---------- */
function defaultConfig() {
  return { v: 1, startingBalance: 0, startMonth: mk(today()),
    expense: EXP_DEFAULT.map(name => ({ name, planned: 0 })),
    income: INC_DEFAULT.map(name => ({ name, planned: 0 })),
    rules: {}, itemRules: {}, recurring: [], goals: [], imports: [], debts: [], pay: {}, accounts: {} };
}
let config = defaultConfig();
let months = {};                 // 'YYYY-MM' -> [tx]
let mode = 'wait';               // 'wait' | 'db' | 'local'
let ocrWorker = null;
let gotConfig = false, gotMonths = false, recurringDone = false;
const ui = { tab: storeGet('lf-tab') || 'home', month: mk(today()), period: storeGet('lf-period') === 'week' ? 'week' : 'month', week: weekStartOf(isoDate(today())), planTab: 'budget', year: today().getFullYear(), search: '', filter: 'all', actCat: '', actDate: 'period', actFrom: '', actTo: '', actShow: 150, catView: null, searchTimer: 0, calMonth: '', calDay: '', cpIdx: 0, cpWhat: '', cpTimer: 0 };

/* ---------- persistence ---------- */
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function mergeConfig(d) {
  const c = Object.assign(defaultConfig(), clone(d || {}));
  for (const k of ['expense','income','recurring','goals','imports','debts']) if (!Array.isArray(c[k])) c[k] = defaultConfig()[k];
  if (!c.rules || typeof c.rules !== 'object') c.rules = {};
  if (!c.itemRules || typeof c.itemRules !== 'object') c.itemRules = {};
  if (!c.accounts || typeof c.accounts !== 'object' || Array.isArray(c.accounts)) c.accounts = {};
  return c;
}
const HH_OK = new Set(['tab', 'month', 'period', 'plantab', 'filter', 'actmore', 'actclear', 'catview', 'catback', 'catactivity', 'calmonth', 'calday', 'forecast', 'fcdays', 'fccomm', 'fcliving', 'edit', 'txdetail', 'close', 'year', 'tmonth', 'skin', 'icon', 'copyurl', 'people', 'personpick', 'peoplesave', 'report', 'reportgo', 'reportshare', 'reportclose', 'backup', 'exportjson', 'exportcsv', 'snaprestore', 'backupnow', 'backuplater', 'toastaction', 'restoreall']);
/* a risky button asks for a second tap */
function confirmTap(el, msg) { if (el.dataset.armed) return true; el.dataset.armed = '1'; el.textContent = msg; setTimeout(() => { delete el.dataset.armed; }, 4000); return false; }
/* ---------- people: each person has their own data; Household joins them, view only ---------- */
let pdata = {}, curId = '1';
let people = (() => { try { const p = JSON.parse(storeGet('lf-people') || 'null'); if (p && p.names) return p; } catch {} return { names: { '1': 'Me' }, active: '1' }; })();
const PKEY = id => id === '1' ? 'lf-data' : 'lf-data-' + id;
const personIds = () => Object.keys(people.names).filter(id => people.names[id] != null).sort();
const pname = id => (people.names[id] || 'Person ' + id);
const isHH = () => curId === 'h';
const hasTwo = () => personIds().length > 1;
function savePeople() { storeSet('lf-people', JSON.stringify(people)); }
/* run fn against one person's data, then put everything back */
function withPerson(id, fn) {
  const sc = config, sm = months, sid = curId;
  config = pdata[id].config; months = pdata[id].months; curId = id;
  try { return fn(); } finally { config = sc; months = sm; curId = sid; }
}
function saveLocal() {
  if (isHH()) return;
  pdata[curId] = { config, months };
  try { localStorage.setItem(PKEY(curId), JSON.stringify({ config, months })); }
  catch { toast('Could not save. Your phone storage may be full. Save a backup file now.'); }
}
/* household: categories added up, everyone's bills, debts, goals and accounts with the person's name */
function buildHousehold() {
  const c = defaultConfig(), m = {}, p1 = pdata[personIds()[0]].config;
  Object.assign(c, { expense: [], income: [], recurring: [], goals: [], debts: [], pots: [], accounts: {}, commissions: [], startingBalance: 0, startMonth: '9999-12', mig: 99,
    safety: { months: +((p1.safety || {}).months) || 6, saved: 0 }, homeOrder: p1.homeOrder, planOrder: p1.planOrder, homeHidden: p1.homeHidden, skin: p1.skin });
  for (const id of personIds()) {
    const d = pdata[id], cf = d.config, tag = n => `${n} (${pname(id)})`, pre = x => `${id}~${x}`;
    for (const type of ['expense', 'income']) for (const k of cf[type] || []) { const ex = c[type].find(x => x.name === k.name); if (ex) ex.planned = round2((+ex.planned || 0) + (+k.planned || 0)); else c[type].push({ name: k.name, planned: +k.planned || 0 }); }
    for (const r of cf.recurring || []) c.recurring.push({ ...r, id: pre(r.id), name: tag(r.name), owner: id });
    for (const g of cf.goals || []) c.goals.push({ ...g, id: pre(g.id), name: tag(g.name), owner: id });
    for (const x of cf.pots || []) c.pots.push({ ...x, id: pre(x.id), name: tag(x.name), owner: id });
    for (const x of cf.debts || []) c.debts.push({ ...x, id: pre(x.id), match: x.match || x.name, name: tag(x.name), owner: id });
    for (const [k, a] of Object.entries(cf.accounts || {})) c.accounts[pre(k)] = { ...a, last4: a.last4, name: tag(a.name), owner: id };
    c.startingBalance = round2(c.startingBalance + (+cf.startingBalance || 0)); if (cf.startMonth && cf.startMonth < c.startMonth) c.startMonth = cf.startMonth;
    c.safety.saved = round2(c.safety.saved + (+((cf.safety || {}).saved) || 0));
    for (const [k, list] of Object.entries(d.months || {})) for (const t of list) (m[k] = m[k] || []).push({ ...t, id: String(t.id).startsWith('rec-') ? 'rec-' + id + '~' + String(t.id).slice(4) : pre(t.id), owner: id, ...(t.acct ? { acct: pre(t.acct) } : {}), ...(t.debtId ? { debtId: pre(t.debtId) } : {}) });
  }
  if (c.startMonth === '9999-12') c.startMonth = mk(today());

}
function switchPerson(id) {
  if (id === 'h' && !hasTwo()) id = personIds()[0];
  if (id === 'h') { const h = buildHousehold(); config = h.config; months = h.months; curId = 'h'; if (ui.planTab === 'commission') ui.planTab = 'budget'; }
  else { config = pdata[id].config; months = pdata[id].months; curId = id; }

  $('addBtn').disabled = isHH();
  closeSheet(); render(); window.scrollTo(0, 0);
}
function personChip() {
  if (!hasTwo() || !['home', 'activity', 'plan', 'category'].includes(ui.tab)) return '';
  return `<div class="row between" style="gap:8px"><button type="button" class="pchip" data-act="people"><span class="pdot" aria-hidden="true">${isHH() ? '⌂' : esc(pname(curId).charAt(0).toUpperCase())}</span>${isHH() ? 'Household' : esc(pname(curId))}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>${isHH() ? '<span class="tiny muted">Both people, view only</span>' : ''}</div>`;
}
function openPeople() {
  const ids = personIds();
  openSheet(`${sheetHead('People')}
  <div class="list">${[...ids.map(id => [id, pname(id), 'Their own money and plans']), ...(ids.length > 1 ? [['h', 'Household', 'Everyone together, view only']] : [])].map(([id, n, sub]) => `<button type="button" class="row between" data-act="personpick" data-id="${id}" style="gap:12px;min-height:56px;border:0;border-bottom:1px solid var(--divider);background:transparent;color:inherit;padding:0;font:inherit;text-align:left;width:100%"><span class="pdot" aria-hidden="true">${id === 'h' ? '⌂' : esc(n.charAt(0).toUpperCase())}</span><span style="flex:1;min-width:0"><span style="display:block;font-weight:700">${esc(n)}</span><span class="tiny muted">${sub}</span></span>${curId === id ? '<span class="chip">Open</span>' : ''}</button>`).join('')}</div>
  <div class="h2" style="margin-top:6px">Names</div>
  ${ids.map(id => `<div class="field"><label for="pn-${id}">Person ${id}</label><input class="input" id="pn-${id}" value="${esc(pname(id))}" maxlength="24" autocomplete="off"></div>`).join('')}
  ${ids.length < 2 ? `<div class="field"><label for="pn-new">Add a second person</label><input class="input" id="pn-new" placeholder="Their name" maxlength="24" autocomplete="off"></div>` : ''}
  <button type="button" class="btn primary block" data-act="peoplesave">Save</button>
  <div class="note">Each person's data stays on this phone. To bring in someone's data from their own phone, save a backup file there, open their name here, then restore it in Backup and restore.</div>
  ${ids.length > 1 ? `<button type="button" class="btn danger block" data-act="persondel" data-id="${ids[ids.length - 1]}">Remove ${esc(pname(ids[ids.length - 1]))} and their data</button>` : ''}`, { kind: 'people' });
}
async function saveConfig() { saveLocal(); }
async function saveMonth() { saveLocal(); }
async function saveMonths() { saveLocal(); }

async function initStore() {
  mode = 'local';
  if (!people.names['1']) people.names['1'] = 'Me';
  for (const id of personIds()) {
    let d = { config: id === '1' ? config : mergeConfig({ startMonth: mk(today()) }), months: {} };
    try { const raw = storeGet(PKEY(id)); if (raw) { const p = JSON.parse(raw); d = { config: mergeConfig(p.config), months: p.months || {} }; } } catch {}
    pdata[id] = d;
  }
  config = pdata['1'].config; months = pdata['1'].months; curId = '1';
  gotConfig = gotMonths = true;
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch {}
  afterLoad();
  if ('serviceWorker' in navigator && location.protocol === 'https:') { try { const had = !!navigator.serviceWorker.controller; navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {}); navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !window.__lfReloaded) { window.__lfReloaded = true; location.reload(); } }); } catch {} }
}
/* data fixes that run once per phone */
function migrate() {
  if ((+config.mig || 0) >= 2) return;
  const touched = new Set();
  if (!config.income.some(c => c.name === BORROW_CAT)) { const i = config.income.findIndex(c => c.name === 'Other'); config.income.splice(i < 0 ? config.income.length : i, 0, { name: BORROW_CAT, planned: 0 }); }
  for (const k of Object.keys(months)) {
    const n = months[k].length;
    months[k] = months[k].filter(t => !(t.type === 'income' && /^repayment\/payment$/i.test(t.desc || '')));
    if (months[k].length !== n) touched.add(k);
    for (const t of months[k]) if (t.type === 'income' && t.cat !== 'Paycheck' && t.cat !== BORROW_CAT && lenderMatch(t.desc)) { t.cat = BORROW_CAT; touched.add(k); }
  }
  for (const r in config.rules) if (r.startsWith('i:') && LENDER_RE.test(r.slice(2))) config.rules[r] = BORROW_CAT;

  if (!(gotConfig && gotMonths)) return;
  for (const id of personIds()) withPerson(id, () => { migrate(); });
  if (!recurringDone) { recurringDone = true; for (const id of personIds()) withPerson(id, () => { applyRecurring(); }); }
  const want = people.active === 'h' ? 'h' : (pdata[people.active] ? people.active : '1');
  if (want === 'h' && hasTwo()) { const h = buildHousehold(); config = h.config; months = h.months; curId = 'h'; } else { config = pdata[want].config; months = pdata[want].months; curId = want; }
  $('addBtn').disabled = isHH();
  autoBackup();
  render();
}

/* ---------- money maths (the fixed spreadsheet logic) ---------- */
const txOf = key => months[key] || [];
function totals(key) {
  let inc = 0, exp = 0;
  let borrowed = 0;
  for (const t of txOf(key)) { if (isBorrowed(t)) borrowed += +t.amount || 0; else if (t.type === 'income') inc += +t.amount || 0; else exp += +t.amount || 0; }
  return { inc: round2(inc), exp: round2(exp), net: round2(inc - exp), borrowed: round2(borrowed) };
}
function startBalance(key) { return key < config.startMonth ? null : balanceAt(addDaysIso(`${key}-01`, -1)); }
function endBalance(key) { return key < config.startMonth ? null : balanceAt(`${key}-${pad(daysIn(key))}`); }
function catActual(key, type, name) { let s = 0; for (const t of txOf(key)) if (t.type === type && t.cat === name) s += +t.amount || 0; return round2(s); }
/* periods: a calendar month, or a Monday to Sunday week. Weekly plans are 12/52 of the monthly plan. */

    <section class="glass card" style="gap:4px;"><div class="tiny muted" style="font-weight:700">Income</div><div class="mid num">${money0(tt.inc)}</div><div class="tiny muted num">${plannedInc ? 'of ' + money0(plannedInc) + ' planned' : 'No plan set'}${tt.borrowed ? ` · ${money0(tt.borrowed)} borrowed not included` : ''}</div></section>

  </section>`

  <button type="button" class="link" style="align-self:center;padding:8px" data-act="arrange">Arrange Home</button>`;

/* Activity: search, type, category and date filters. Typing only redraws the results, not the whole page. */
const ACT_DATES = [['period', 'Month or week shown'], ['30', 'Last 30 days'], ['90', 'Last 3 months'], ['year', 'This year'], ['all', 'All time'], ['custom', 'Pick dates']];
const ACT_PAGE = 150;
function actFiltered() {
  const q = ui.search.trim().toLowerCase(), mode = ui.actDate || 'period', now = isoDate(today());
  let list;
  if (mode === 'period' && !q) list = txRange(curPeriod());
  else if (mode === '30' || mode === '90') list = txRange({ from: addDaysIso(now, mode === '30' ? -29 : -89), to: now });
  else if (mode === 'year') list = txRange({ from: `${now.slice(0, 4)}-01-01`, to: `${now.slice(0, 4)}-12-31` });
  else if (mode === 'custom') { const f = ui.actFrom || '0000-01-01', t = ui.actTo || '9999-12-31'; list = allTx().filter(x => x.date >= f && x.date <= t); }
  else list = allTx();
  if (q) { const qn = q.replace(/[$,]/g, ''); list = list.filter(t => (t.desc + ' ' + t.cat).toLowerCase().includes(q) || (qn && String(t.amount).includes(qn))); }
  if (ui.filter !== 'all') list = list.filter(t => t.type === ui.filter);
  if (ui.actCat) { const [ty, ...rest] = ui.actCat.split('|'), name = rest.join('|'); list = list.filter(t => t.type === ty && t.cat === name); }
  return list.sort((a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id)));
}
function actHead() {
  const q = ui.search.trim(), mode = ui.actDate || 'period';
  if (mode === 'period' && !q) return periodBar();
  const label = q ? 'Search results' : (ACT_DATES.find(d => d[0] === mode) || ACT_DATES[0])[1];
  return `<h1 class="h1">${esc(label)}</h1>${q && mode === 'period' ? '<div class="tiny muted" style="margin-top:-8px">Searching all dates</div>' : ''}`;
}
function actResults() {
  const list = actFiltered(), shown = list.slice(0, ui.actShow || ACT_PAGE), q = ui.search.trim();
  const groups = []; let last = null;
  for (const t of shown) { if (t.date !== last) { groups.push({ day: t.date, items: [] }); last = t.date; } groups[groups.length - 1].items.push(t); }
  const sum = list.reduce((a, t) => a + (t.type === 'income' ? +t.amount : -t.amount), 0);
  const filtered = q || ui.actCat || ui.filter !== 'all' || (ui.actDate && ui.actDate !== 'period');
  return `<div class="row between small muted" style="padding:0 4px"><span>${list.length} transaction${list.length === 1 ? '' : 's'}</span><span class="num">Net ${sum < 0 ? '−' : '+'}${money(Math.abs(sum))}</span></div>
  ${groups.length ? `<section class="glass card" style="padding:4px 14px 8px">${groups.map(g => `<div class="daylabel">${esc(prettyDay(g.day))}</div><div class="list">${g.items.map(txRow).join('')}</div>`).join('')}</section>
    ${list.length > shown.length ? `<button type="button" class="btn block" data-act="actmore">Show ${Math.min(ACT_PAGE, list.length - shown.length)} more of ${list.length - shown.length}</button>` : ''}`
    : `<div class="glass empty"><div style="font-weight:700;color:var(--fg)">${filtered ? 'No matches' : 'Nothing here yet'}</div><div class="small">${filtered ? 'Try a shorter search or clear the filters.' : 'Tap + to add a transaction or scan a receipt.'}</div></div>`}`;
}
function refreshActivity() {
  const h = $('actHead'), r = $('actResults'); if (!h || !r) { render(); return; }
  h.innerHTML = actHead(); r.innerHTML = actResults();
}
function viewActivity() {
  const mode = ui.actDate || 'period';
  const catOpt = type => (type === 'income' ? config.income : config.expense).map(c => { const v = `${type}|${c.name}`; return `<option value="${esc(v)}" ${ui.actCat === v ? 'selected' : ''}>${esc(c.name)}</option>`; }).join('');
  const active = ui.actCat || ui.filter !== 'all' || mode !== 'period' || ui.search.trim();
  return `${loadingNote()}<div id="actHead" style="display:flex;flex-direction:column;gap:14px">${actHead()}</div>
  <div class="field"><label for="search">Search all transactions</label><input class="input" id="search" type="search" placeholder="Store, category or amount" value="${esc(ui.search)}" autocomplete="off" autocorrect="off" spellcheck="false"></div>
  <div class="seg" role="group" aria-label="Filter">
    ${['all','expense','income'].map(f => `<button type="button" data-act="filter" data-f="${f}" aria-pressed="${ui.filter === f}">${f === 'all' ? 'All' : f === 'expense' ? 'Expenses' : 'Income'}</button>`).join('')}
  </div>
  <div class="grid2">
    <div class="field"><label for="act-cat">Category</label><select class="input" id="act-cat"><option value="">All categories</option>${ui.filter !== 'income' ? `<optgroup label="Expenses">${catOpt('expense')}</optgroup>` : ''}${ui.filter !== 'expense' ? `<optgroup label="Income">${catOpt('income')}</optgroup>` : ''}</select></div>
    <div class="field"><label for="act-date">Dates</label><select class="input" id="act-date">${ACT_DATES.map(([v, l]) => `<option value="${v}" ${mode === v ? 'selected' : ''}>${v === 'period' ? (ui.period === 'week' ? 'Week shown' : 'Month shown') : l}</option>`).join('')}</select></div>
  </div>
  ${mode === 'custom' ? `<div class="grid2"><div class="field"><label for="act-from">From</label><input class="input" type="date" id="act-from" value="${esc(ui.actFrom || '')}"></div><div class="field"><label for="act-to">To</label><input class="input" type="date" id="act-to" value="${esc(ui.actTo || '')}"></div></div>` : ''}
  ${active ? '<button type="button" class="link" style="align-self:flex-start" data-act="actclear">Clear search and filters</button>' : ''}
  <div id="actResults" style="display:flex;flex-direction:column;gap:14px">${actResults()}</div>`;
}

/* one category: every transaction in it for the month or week, its plan, past months and top stores */
function viewCategory() {
  const c = ui.catView || { type: 'expense', name: '' }, p = curPeriod(), wk = p.kind === 'week';
  const r = catRows(p, c.type).find(x => x.name === c.name) || { name: c.name, planned: 0, actual: 0, pct: 0, diff: 0, status: 'none' };
  const tx = txRange(p).filter(t => t.type === c.type && t.cat === c.name).sort((a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id)));
  const keys = Array.from({ length: 6 }, (_, i) => addMonths(ui.month, i - 5)), vals = keys.map(k => catActual(k, c.type, c.name));
  const planM = +((c.type === 'income' ? config.income : config.expense).find(x => x.name === c.name) || {}).planned || 0;
  const maxV = Math.max(1, planM, ...vals), avg6 = vals.reduce((a, b) => a + b, 0) / 6;
  const by = {}; for (const t of tx) { const n = storeName(t.desc); by[n] = by[n] || { n, v: 0, c: 0 }; by[n].v += +t.amount || 0; by[n].c++; }
  const stores = Object.values(by).sort((a, b) => b.v - a.v).slice(0, 6);
  const groups = []; let last = null;
  for (const t of tx) { if (t.date !== last) { groups.push({ day: t.date, items: [] }); last = t.date; } groups[groups.length - 1].items.push(t); }
  const col = r.status === 'over' ? 'var(--over)' : r.status === 'warn' ? 'var(--warn)' : 'var(--muted)';
  return `<div class="row between"><button type="button" class="iconbtn" data-act="catback" aria-label="Back to Plan">${I.left}</button><h1 class="h1" style="text-align:center;min-width:0;overflow-wrap:anywhere">${esc(c.name)}</h1><button type="button" class="link" data-act="catactivity">Search</button></div>
  ${periodBar()}
  <section class="glass card" aria-label="${esc(c.name)} total">
    <div class="small muted" style="font-weight:600">${c.type === 'income' ? 'Received' : 'Spent'} this ${wk ? 'week' : 'month'}</div>
    <div class="big num">${money(r.actual)}</div>
    ${r.planned ? `<div class="small num" style="color:${col};font-weight:700">${r.diff >= 0 ? money(r.diff) + ' left' : money(-r.diff) + ' over'} of your ${money0(r.planned)} plan</div>${c.type === 'expense' ? statusBar(r) : ''}` : '<div class="small muted">No plan set for this category.</div>'}
    <div class="row" style="flex-wrap:wrap"><span class="chip num">${tx.length} transaction${tx.length === 1 ? '' : 's'}</span>${tx.length ? `<span class="chip num">${money(r.actual / tx.length)} each on average</span>` : ''}</div>
  </section>
  <section class="glass card" aria-label="Last 6 months">
    <div class="row between"><div class="h2">Last 6 months</div><span class="small muted num">${money0(avg6)} a month on average</span></div>
    <div class="chart" role="img" aria-label="${esc(c.name)} each month for 6 months">${keys.map((k, i) => `<div class="col"><span class="tiny muted num">${vals[i] ? money0(vals[i]) : ''}</span><div class="pair" style="height:80px"><i style="width:22px;height:${Math.round(vals[i] / maxV * 80)}px;background:${k === ui.month ? 'var(--accent)' : 'var(--track)'}"></i></div><span class="tiny muted" style="font-weight:700">${MONTHS[+k.slice(5) - 1].slice(0, 3)}</span></div>`).join('')}</div>
    ${planM ? `<div class="tiny muted num">Monthly plan ${money0(planM)}. Months over plan: ${vals.filter(v => v > planM).length} of 6.</div>` : ''}
  </section>
  ${stores.length > 1 ? `<section class="glass card" aria-label="Top stores"><div class="h2">Where it went</div>${stores.map(x => `<div class="row between small"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.n)} <span class="muted">${x.c}×</span></span><span class="num" style="font-weight:700">${money(x.v)}</span></div>`).join('')}</section>` : ''}
  ${groups.length ? `<section class="glass card" style="padding:4px 14px 8px" aria-label="Transactions">${groups.map(g => `<div class="daylabel">${esc(prettyDay(g.day))}</div><div class="list">${g.items.map(txRow).join('')}</div>`).join('')}</section>`
    : `<div class="glass empty"><div style="font-weight:700;color:var(--fg)">Nothing in ${esc(c.name)}</div><div class="small">No transactions this ${wk ? 'week' : 'month'}. Use the arrows to look at other ${wk ? 'weeks' : 'months'}.</div></div>`}`;
}

function viewPlan() {
  const tabs = `<div class="seg" role="group" aria-label="Plan views" style="overflow-x:auto;scrollbar-width:none">${ordered(PLAN_TABS, config.planOrder).filter(([k]) => !(isHH() && k === 'commission')).map(([k, l]) => `<button type="button" data-act="plantab" data-p="${k}" aria-pressed="${ui.planTab === k}" style="font-size:13px;padding:0 10px;flex:1 0 auto">${l}</button>`).join('')}</div>`;
  if (ui.planTab === 'goals') return `${tabs}${viewGoals()}`;
  if (ui.planTab === 'debts') return `${tabs}${viewDebts()}`;
  if (ui.planTab === 'savings') return `${tabs}${viewSavings()}`;
  if (ui.planTab === 'trends') return `${tabs}${viewTrends()}`;
  if (ui.planTab === 'year') return `${tabs}${viewYear()}`;
  if (ui.planTab === 'calendar') return `${tabs}${viewCalendar()}`;
  if (ui.planTab === 'borrow') return `${tabs}${viewBorrowing()}`;
  if (ui.planTab === 'commission' && !isHH()) return `${tabs}${viewCommission()}`;
  const p = curPeriod(), wk = p.kind === 'week';
  const block = (type, title) => {
    const rows = catRows(p, type);
    const real = rows.filter(r => !(type === 'income' && r.name === BORROW_CAT)), tp = real.reduce((a, r) => a + r.planned, 0), ta = real.reduce((a, r) => a + r.actual, 0);
    return `<section class="glass card" aria-label="${title}"><div class="row between"><div class="h2">${title}</div><span class="small muted num">${money0(ta)} of ${money0(tp)}</span></div>
      ${rows.map(r => `<div style="display:flex;flex-direction:column;gap:6px">
        <div class="row between"><button type="button" data-act="catview" data-type="${type}" data-name="${esc(r.name)}" aria-label="Open ${esc(r.name)}" style="min-width:0;flex:1;display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;text-align:left;color:inherit;font:inherit;cursor:pointer"><span style="min-width:0"><span style="display:block;font-weight:600">${esc(r.name)}</span><span class="tiny num" style="display:block;color:${r.status === 'over' ? 'var(--over)' : r.status === 'warn' ? 'var(--warn)' : 'var(--muted)'}">${money(r.actual)} actual${r.planned ? ' · ' + (r.diff >= 0 ? money(r.diff) + ' left' : money(-r.diff) + ' over') : ''}</span></span><span class="muted" style="flex:none;display:flex">${I.chev}</span></button>
        ${r.idx >= 0 ? `<input class="planinput num" inputmode="decimal" aria-label="${wk ? 'Weekly' : 'Monthly'} plan for ${esc(r.name)}" id="plan-${type}-${r.idx}" data-plan="${type}" data-i="${r.idx}" data-f="${p.factor}" value="${r.planned || ''}" placeholder="$0" ${isHH() ? 'readonly' : ''}>` : '<span class="tiny muted">Not in list</span>'}</div>
        ${type === 'expense' ? statusBar(r) : ''}</div>`).join('')}</section>`;
  };
  const note = wk ? 'Weekly plans are your monthly plans spread over the year. Change one and the other updates.' : 'Plans repeat every month.';
  return `${tabs}${periodBar()}<div class="note" style="padding:0 4px">${note} Bars turn orange at 80% and red when you go over. Tap a category to see its transactions.</div>${block('expense','Expenses')}${block('income','Income')}`;
}

function viewGoals() {
  const cur = mk(today());
  return `${config.goals.length ? config.goals.map(g => {
    const p = g.target > 0 ? Math.min(1, g.saved / g.target) : 0, left = Math.max(0, g.target - g.saved);
    const mLeft = g.due ? monthDiff(cur, g.due) : 0;
    const per = left <= 0 ? 'Goal reached' : g.due ? (mLeft > 0 ? `Save ${money(left / mLeft)} a month to reach it by ${monthName(g.due).name.slice(0,3)} ${monthName(g.due).year}` : `Due now: ${money(left)} to go`) : `${money(left)} to go`;
    return `<section class="glass card"><div class="row">
      <div class="goalring" style="background:conic-gradient(var(--accent) 0 ${Math.round(p*360)}deg, var(--track) ${Math.round(p*360)}deg 360deg)" role="img" aria-label="${Math.round(p*100)} percent saved"><span class="num">${Math.round(p*100)}%</span></div>
      <div style="flex:1;min-width:0"><div class="h2" style="overflow-wrap:anywhere">${esc(g.name)}</div><div class="small muted num">${money(g.saved)} of ${money(g.target)}</div></div></div>
      <div class="small">${esc(per)}</div>
      <div class="row"><button type="button" class="btn primary" style="flex:1" data-act="goaladd" data-id="${esc(g.id)}">Add money</button><button type="button" class="btn" data-act="goaledit" data-id="${esc(g.id)}">Edit</button></div></section>`;
  }).join('') : `<div class="glass empty"><div style="font-weight:700;color:var(--fg)">No goals yet</div><div class="small">Set a target and a date. The app works out how much to save each month.</div></div>`}
  <button type="button" class="btn block" data-act="goaledit">New goal</button>`;
}

function viewYear() {
  const y = ui.year, keys = Array.from({ length: 12 }, (_, i) => `${y}-${pad(i+1)}`);
  const data = keys.map(k => ({ k, ...totals(k), end: endBalance(k) }));
  const maxV = Math.max(1, ...data.map(d => Math.max(d.inc, d.exp)));
  const tInc = data.reduce((a, d) => a + d.inc, 0), tExp = data.reduce((a, d) => a + d.exp, 0), active = data.filter(d => d.inc || d.exp || d.borrowed), avgNet = active.length ? active.reduce((a, d) => a + d.net, 0) / active.length : 0;
  const cats = config.expense.map(c => { const vals = keys.map(k => catActual(k, 'expense', c.name)); return { name: c.name, total: vals.reduce((a, b) => a + b, 0), avg: avgPositive(vals) }; }).filter(c => c.total > 0).sort((a, b) => b.total - a.total);
  return `<div class="row between">
    <button type="button" class="iconbtn" data-act="year" data-d="-1" aria-label="Previous year">${I.left}</button>
    <h1 class="h1 num">${y}</h1>
    <button type="button" class="iconbtn" data-act="year" data-d="1" aria-label="Next year">${I.right}</button></div>
  <section class="glass card"><div class="row between"><div class="h2">Income and expenses</div><div class="legend"><span><b style="background:var(--good)"></b>Income</span><span><b style="background:var(--warn)"></b>Expenses</span></div></div>
    <div class="chart" role="img" aria-label="Monthly income and expenses for ${y}">${data.map((d, i) => `<div class="col"><div class="pair"><i class="inc" style="height:${Math.round(d.inc / maxV * 96)}px"></i><i class="exp" style="height:${Math.round(d.exp / maxV * 96)}px"></i></div><span class="tiny muted" style="font-weight:700">${MSHORT[i]}</span></div>`).join('')}</div></section>
  <section class="glass card"><div class="h2">Summary</div><div class="tablebox"><table>
    <thead><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Net</th><th>Balance</th></tr></thead>
    <tbody>${data.map((d, i) => `<tr><td>${MONTHS[i].slice(0,3)}</td><td>${money0(d.inc)}</td><td>${money0(d.exp)}</td><td class="${d.net < 0 ? 'neg' : ''}">${money0(d.net)}</td><td class="${d.end != null && d.end < 0 ? 'neg' : ''}">${d.end == null || d.k > mk(today()) ? '—' : money0(d.end)}</td></tr>`).join('')}
    <tr class="total"><td>Total</td><td>${money0(tInc)}</td><td>${money0(tExp)}</td><td class="${tInc - tExp < 0 ? 'neg' : ''}">${money0(tInc - tExp)}</td><td></td></tr>
    <tr class="total"><td>Average</td><td>${money0(avgPositive(data.map(d => d.inc)))}</td><td>${money0(avgPositive(data.map(d => d.exp)))}</td><td class="${avgNet < 0 ? 'neg' : ''}">${money0(avgNet)}</td><td></td></tr></tbody></table></div>
    <div class="tiny muted">Averages count only months with activity.${data.some(d => d.borrowed) ? ` Income leaves out ${money0(data.reduce((a, d) => a + d.borrowed, 0))} borrowed from loans and pay advances. Balance includes it.` : ''}</div></section>
  ${cats.length ? `<section class="glass card"><div class="h2">Spending by category</div><div class="tablebox"><table><thead><tr><th>Category</th><th>Total</th><th>Monthly avg</th></tr></thead><tbody>${cats.map(c => `<tr><td>${esc(c.name)}</td><td>${money0(c.total)}</td><td>${money0(c.avg)}</td></tr>`).join('')}</tbody></table></div></section>` : ''}`;
}

function viewMore() {

  const pp = `<button type="button" data-act="people"><span class="ic">${I.people}</span>People and household<span class="small muted" style="margin-left:auto">${isHH() ? 'Household' : esc(pname(curId))}</span>${I.chev}</button>

/* ---------- Commission: how the next commission covers the month ahead ---------- */
function commCycles() {
  const pi = payInfo(), now = isoDate(today()), out = [];
  for (let i = 0; out.length < 3 && i < 5; i++) {
    const pd = firstPaydayOf(addMonths(mk(today()), i), pi); if (pd < now) continue;
    const end = addDaysIso(firstPaydayOf(addMonths(pd.slice(0, 7), 1), pi), -1);
    out.push({ pd, end });
  }
  return out;
}
function commPlan(cy, whatIf) {
  const pi = payInfo(), base = baseGrossYear() / payPeriods(), entered = commissionRows().rows.find(x => x.payDate === cy.pd && x.actual == null), cs = commissionStats();
  let take, gross = null, src;
  if (whatIf != null && whatIf >= 0) { gross = whatIf; take = payAfterTax(round2(base + whatIf), cy.pd); src = 'what if'; }
  else if (entered) { take = entered.expect; gross = round2(entered.total - base); src = 'entered'; }
  else { take = round2(pi.base + cs.avg); src = 'average'; }
  const step = pi.freq === 'fortnightly' ? 14 : 7; let basePays = 0; for (let d = addDaysIso(cy.pd, step); d <= cy.end; d = addDaysIso(d, step)) basePays++;
  const inc = round2(take + basePays * pi.base), bills = scheduledBills(cy.pd, cy.end), billT = round2(bills.reduce((a, x) => a + x.v, 0));
  const days = dayDiff(cy.pd, cy.end) + 1, monthsF = days / (365 / 12);
  // spending plan beyond bills: each category's plan less the bills already in it
  const billCat = {}; for (const x of bills) billCat[x.cat] = (billCat[x.cat] || 0) + x.v;
  const spend = round2(config.expense.reduce((a, c) => a + Math.max(0, (+c.planned || 0) * monthsF - (billCat[c.name] || 0)), 0));
  const groups = {}; for (const x of bills) { const g = x.cat === 'Debt' ? 'Debt repayments' : x.cat === 'Home' ? 'Rent and home' : x.cat || 'Other'; groups[g] = (groups[g] || 0) + x.v; }
  return { take, gross, src, basePays, inc, billT, spend, left: round2(inc - billT - spend), afterBills: round2(inc - billT), days, weeks: days / 7, groups: Object.entries(groups).sort((a, b) => b[1] - a[1]) };
}

/* swipe left on a transaction to delete it */
const SW = { row: null, open: null, x0: 0, y0: 0, base: 0, dx: 0, mode: '' };
const DEL_W = 88;
function swipeSet(row, x, anim) {
  const tx = row.querySelector('.tx'), del = row.querySelector('.swipe-del');
  tx.style.transition = del.style.transition = anim ? 'transform .22s ease, width .22s ease' : 'none';
  tx.style.transform = x ? `translateX(${x}px)` : '';
  del.style.width = `${Math.max(0, -x)}px`;
  del.tabIndex = x ? 0 : -1;
}
function swipeClose(row) { if (row) swipeSet(row, 0, true); if (SW.open === row) SW.open = null; }

  const row = e.target.closest('.swipe');
  if (SW.open && SW.open !== row) swipeClose(SW.open);
  if (!row || e.target.closest('.swipe-del')) return;
  SW.row = row; SW.x0 = e.clientX; SW.y0 = e.clientY; SW.base = SW.open === row ? -DEL_W : 0; SW.dx = SW.base; SW.mode = '';
});
document.addEventListener('pointermove', e => {
  const row = SW.row; if (!row) return;
  const dx = e.clientX - SW.x0, dy = e.clientY - SW.y0;
  if (!SW.mode) { if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) SW.mode = 'h'; else if (Math.abs(dy) > 8) { SW.mode = 'v'; SW.row = null; return; } else return; }
  SW.dx = Math.min(0, Math.max(-row.offsetWidth, SW.base + dx));
  swipeSet(row, SW.dx, false);
});
function swipeEnd() {
  const row = SW.row; SW.row = null; if (!row || SW.mode !== 'h') return;
  row.dataset.swiped = '1'; setTimeout(() => { delete row.dataset.swiped; }, 350);
  if (SW.dx < -row.offsetWidth * 0.55) { swipeSet(row, -row.offsetWidth, true); const t = txOf(row.dataset.m).find(x => x.id === row.dataset.id); if (t) setTimeout(() => removeTx(t), 180); return; }
  if (SW.dx < -DEL_W / 2) { swipeSet(row, -DEL_W, true); SW.open = row; } else swipeClose(row);
}
document.addEventListener('pointerup', swipeEnd);
document.addEventListener('pointercancel', swipeEnd);

/* weekly copies kept on this phone in IndexedDB */
function snapDB() { return new Promise((res, rej) => { const r = indexedDB.open('lagoon-snaps', 1); r.onupgradeneeded = () => r.result.createObjectStore('snaps', { keyPath: 'at' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function snapReq(mode, fn) { return snapDB().then(db => new Promise((res, rej) => { const tx = db.transaction('snaps', mode), st = tx.objectStore('snaps'), r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); })); }
async function snapList() { const all = await snapReq('readonly', st => st.getAllKeys()); return (all || []).sort((a, b) => b - a).map(at => ({ at })); }
async function snapSave() {
  const at = Date.now(); await snapReq('readwrite', st => st.put({ at, json: JSON.stringify(fullBackup()) }));
  const keys = (await snapReq('readonly', st => st.getAllKeys()) || []).sort((a, b) => b - a);
  for (const k of keys.slice(6)) await snapReq('readwrite', st => st.delete(k));
  storeSet('lf-snap-at', String(at));
}
async function autoBackup() {

}

/* Home reminder when the last backup file is more than a week old */
function backupBanner() {

  const days = fileAt ? Math.floor((now - fileAt) / 864e5) : null;
  return `<section class="glass card" aria-label="Backup due" style="gap:10px"><div class="row between"><div class="h2">Backup due</div><span class="chip warn">${days == null ? 'No file yet' : days + ' days'}</span></div>

}
async function saveFile(filename, data, type) {
  const file = new File([data], filename, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

    case 'arrange': openArrange(); break;
    case 'move': { const key = el.dataset.kind === 'home' ? 'homeOrder' : 'planOrder', list = ordered(el.dataset.kind === 'home' ? HOME_SECTIONS : PLAN_TABS, config[key]).map(x => x[0]), i = list.indexOf(el.dataset.id), j = i + +el.dataset.d; if (j < 0 || j >= list.length) break; [list[i], list[j]] = [list[j], list[i]]; config[key] = list; openArrange(); render(); await saveConfig(); break; }
    case 'arrangereset': config.homeOrder = []; config.planOrder = []; config.homeHidden = []; openArrange(); render(); await saveConfig(); break;
    case 'acctedit': openAcct(el.dataset.k); break;
    case 'savacct': { const x = (config.accounts || {})[el.dataset.k]; if (!x) break; x.kind = isSavingsAcct(x) ? 'bank' : 'savings'; x.kindSet = true; render(); await saveConfig(); break; }
    case 'acctsave': { const old = config.accounts[sheetCtx.k], last4 = $('a-last4').value.replace(/\D/g, '').slice(-4), k2 = last4 || sheetCtx.k; delete config.accounts[sheetCtx.k]; config.accounts[k2] = { ...old, name: $('a-name').value.trim() || old.name, nameSet: true, last4, kind: $('a-kind').value, kindSet: true, count: $('a-count').checked }; closeSheet(); render(); await saveConfig(); toast('Account saved'); break; }
    case 'acctdel': if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Tap again to remove'; break; } delete config.accounts[sheetCtx.k]; closeSheet(); render(); await saveConfig(); toast('Account removed'); break;
    case 'shotgo': runShotImport(); break;
    case 'billsimportgo': { const bs = sheetCtx.bills || [], rm = (sheetCtx.removals || []).map(n => n.toLowerCase()); config.recurring = config.recurring.filter(r => !rm.includes(r.name.toLowerCase())); for (const b of bs) { const ex = config.recurring.find(r => r.name.toLowerCase() === b.name.toLowerCase()); if (ex) { Object.assign(ex, b); delete ex.day; delete ex.start; } else config.recurring.push({ id: uid(), ...b, skip: [] }); } closeSheet(); await saveConfig(); applyRecurring(); render(); toast(`Added ${bs.length} recurring bills`); break; }
    case 'budgetimportgo': { const it = sheetCtx.items || []; for (const x of it) { const list = x.type === 'income' ? config.income : config.expense, c = list.find(k => k.name === x.name); if (c) c.planned = x.planned; else list.push({ name: x.name, planned: x.planned }); } closeSheet(); ui.tab = 'plan'; ui.planTab = 'budget'; render(); await saveConfig(); toast(`Set ${it.length} budgets`); break; }
    case 'goalimportgo': { const gs = sheetCtx.goals || []; for (const g of gs) config.goals.push({ id: uid(), ...g }); closeSheet(); ui.tab = 'plan'; ui.planTab = 'goals'; render(); await saveConfig(); toast(`Added ${gs.length} goal${gs.length === 1 ? '' : 's'}`); break; }
    case 'goaldel': if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Tap again to delete'; break; } config.goals = config.goals.filter(g => g.id !== sheetCtx.id); closeSheet(); render(); await saveConfig(); toast('Goal deleted'); break;
    case 'goaladd': openGoalAdd(el.dataset.id); break;
    case 'goaladdsave': { const v = parseMoney($('ga-amount').value); if (!isFinite(v) || !v) { toast('Enter an amount.'); break; } const g = config.goals.find(x => x.id === sheetCtx.id); g.saved = round2(Math.max(0, g.saved + v)); closeSheet(); render(); await saveConfig(); toast(g.saved >= g.target ? 'Goal reached' : 'Added to goal'); break; }
    case 'settings': openSettings(); break;
    case 'settingssave': { const v = parseMoney($('s-bal').value); config.startingBalance = isFinite(v) ? round2(v) : 0; config.startMonth = $('s-month').value || mk(today()); closeSheet(); render(); await saveConfig(); toast('Saved'); break; }
    case 'categories': openCategories(); break;
    case 'catadd': { const type = el.dataset.type, inp = $('newcat-' + type), name = inp.value.trim(); if (!name) break; if (config[type].some(c => c.name.toLowerCase() === name.toLowerCase())) { toast('That category already exists.'); break; } config[type].push({ name, planned: 0 }); openCategories(); render(); await saveConfig(); break; }
    case 'catdel': { if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Tap again'; break; } config[el.dataset.type].splice(+el.dataset.i, 1); openCategories(); render(); await saveConfig(); break; }
    case 'ruledel': delete config.rules[el.dataset.k]; openCategories(); await saveConfig(); break;
    case 'import': openImport(); break;
    case 'importgo': runImport(); break;
    case 'importreplace': if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Tap again to replace'; break; } runImport(true); break;
    case 'imports': openImports(); break;
    case 'impdel': deleteImport(el); break;
    case 'backup': openBackup(); break;
    case 'skin': applySkin(el.dataset.v); if (config.skin !== el.dataset.v) { config.skin = el.dataset.v; saveConfig(); } render(); break;
    case 'icon': openIconSheet(el.dataset.v); break;
    case 'copyurl': { const u = sheetCtx && sheetCtx.url; try { await navigator.clipboard.writeText(u); toast('Link copied'); } catch { const r = document.createRange(); r.selectNodeContents($('iconurl')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Link selected. Tap Copy.'); } break; }
    case 'exportjson': exportJSON(); break;
    case 'exportcsv': exportCSV(); break;
    case 'restorego': runRestore(); break;
    case 'report': openReport(); break;
    case 'reportgo': ui.rpMonth = ($('rp-month') || {}).value || ui.rpMonth || mk(today()); showReport(ui.rpMonth); break;
    case 'reportshare': { const k = ($('rp-month') || {}).value || ui.rpMonth || mk(today()); ui.rpMonth = k; await saveFile(`lagoon-report-${isHH() ? 'household' : pname(curId).toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${k}.html`, reportHTML(k), 'text/html'); break; }
    case 'reportclose': { const ov = $('reportView'); if (ov) ov.remove(); break; }
    case 'restoreall': if (!confirmTap(el, 'Tap again to replace everyone')) break; runRestoreAll(); break;
    case 'snaprestore': { try { const r = await snapReq('readonly', st => st.get(+el.dataset.at)); offerRestore(JSON.parse(r.json), new Date(+el.dataset.at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) + ' (automatic)'); } catch { toast('Could not read that backup.'); } break; }
    case 'backupnow': exportJSON(); break;
    case 'backuplater': storeSet('lf-file-later', String(Date.now() + 2 * 864e5)); render(); break;
  }
});
function autoCat(desc) {
  if (!sheetCtx || sheetCtx.catTouched) return;
  const s = suggestCat(desc, sheetCtx.type), sel = $('f-cat'), hint = $('catHint');
  if (s && sel) { sel.innerHTML = catOptions(sheetCtx.type, s); if (hint) { hint.hidden = false; hint.textContent = `Category set to ${s} from the store name.`; } }
}
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'cp-what') { ui.cpWhat = e.target.value; clearTimeout(ui.cpTimer); ui.cpTimer = setTimeout(() => { const b = $('cpBody'); if (b) b.innerHTML = cpBody(); }, 200); }
  else if (id === 'search') { ui.search = e.target.value; ui.actShow = ACT_PAGE; clearTimeout(ui.searchTimer); ui.searchTimer = setTimeout(refreshActivity, 180); }
  else if (id === 'f-desc' && sheetCtx && sheetCtx.kind === 'tx') autoCat(e.target.value);
  else if (id === 'f-amount' && sheetCtx && sheetCtx.items) renderSplit();
  else if (id === 'x-amount' && sheetCtx && sheetCtx.kind === 'extra') extraPreview();
  else if (id === 'r-times') recPreview();
  else if (e.target.dataset && e.target.dataset.ess) { let t = 0; document.querySelectorAll('[data-ess]').forEach(i => { const v = parseMoney(i.value); if (isFinite(v)) t += Math.abs(v); }); const el = $('essTotal'); if (el) el.textContent = money0(t); const tg = $('essTargets'); if (tg) tg.innerHTML = essTargets(t); }
  else if ((id === 'c-gross' || id === 'c-month') && sheetCtx && sheetCtx.kind === 'pay') commPreview();
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (isHH() && !/^(act-|pn-)/.test(el.id || '')) { render(); toast('Household is view only. Open a person to change this.'); return; }
  if (el.id === 'act-cat') { ui.actCat = el.value; ui.actShow = ACT_PAGE; render(); return; }
  if (el.id === 'act-date') { ui.actDate = el.value; ui.actShow = ACT_PAGE; render(); return; }
  if (el.id === 'act-from' || el.id === 'act-to') { ui[el.id === 'act-from' ? 'actFrom' : 'actTo'] = el.value; ui.actShow = ACT_PAGE; refreshActivity(); return; }
  if (el.id === 'f-cat' && sheetCtx) { sheetCtx.catTouched = !!el.value; const h = $('catHint'); if (h) h.hidden = true; if (sheetCtx.items) renderSplit(); }
  else if (el.id === 'split-on' && sheetCtx) sheetCtx.splitOn = el.checked;
  else if (el.dataset.item && sheetCtx && sheetCtx.items) { const i = sheetCtx.items[+el.dataset.item]; i.cat = el.value; i.touched = true; sheetCtx.itemsOpen = true; renderSplit(); }
  else if (el.id === 'f-receipt' && el.files && el.files[0]) { scanReceipt(el.files[0]); el.value = ''; }
  else if (el.id === 'r-start' || el.id === 'r-freq' || el.id === 'r-end') recPreview();
  else if (el.id === 'csvfile' && el.files && el.files[0]) readCSV(el.files[0]);
  else if (el.dataset.show && sheetCtx && sheetCtx.kind === 'arrange') { const h = new Set(config.homeHidden || []); if (el.checked) h.delete(el.dataset.show); else h.add(el.dataset.show); config.homeHidden = [...h]; render(); await saveConfig(); }
  else if (el.id === 'shotfile' && el.files && el.files.length) { readShots([...el.files]); el.value = ''; }
  else if (el.id === 'restorefile' && el.files && el.files[0]) readBackup(el.files[0]);
  else if (el.id === 'mp-own' && sheetCtx && sheetCtx.kind === 'import') { sheetCtx.map.own = el.checked; openImport(sheetCtx); }
  else if (el.dataset.map && sheetCtx && sheetCtx.kind === 'import') { const k = el.dataset.map; sheetCtx.map[k] = (k === 'fmt' || k === 'sign') ? el.value : +el.value; openImport(sheetCtx); }
  else if (el.dataset.plan) { const v = parseMoney(el.value); config[el.dataset.plan][+el.dataset.i].planned = isFinite(v) ? Math.abs(round2(v / (+el.dataset.f || 1))) : 0; render(); await saveConfig(); }
});
document.addEventListener('toggle', e => { if (e.target.id === 'splitItems' && sheetCtx) sheetCtx.itemsOpen = e.target.open; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

$('addBtn').disabled = true;
initStore();
})();
</script>
