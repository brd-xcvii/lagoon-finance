name: Key guard
# Runs on every push and pull request. Fails loudly if anything that looks like an API key is in the code.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for API keys
        run: bash scripts/check-keys.sh
